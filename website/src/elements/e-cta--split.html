<section class="section">
  <div class="container">
    <div class="cta cta--split">
      <div class="cta__copy">
        {{#pill}}<div class="eyebrow"><i></i> {{pill}}</div>{{/pill}}
        <h2 class="cta__title">{{{title}}}</h2>
        {{#sub}}<p class="cta__desc">{{{sub}}}</p>{{/sub}}
      </div>
      <div class="cta__panel">
        {{{actions}}}
        {{#meta}}<div class="cta__meta">{{meta}}</div>{{/meta}}
      </div>
    </div>
  </div>
</section>
