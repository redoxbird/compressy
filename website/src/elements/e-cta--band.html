<section class="cta cta--band">
  <div class="container cta__inner">
    {{#pill}}<span class="pill pill--warm cta__pill">{{pill}}</span>{{/pill}}
    <h2>{{{title}}}</h2>
    {{#sub}}<p class="cta__sub">{{{sub}}}</p>{{/sub}}
    <div class="cta__actions">{{{actions}}}</div>
    {{#meta}}<div class="cta__meta">{{meta}}</div>{{/meta}}
  </div>
</section>
