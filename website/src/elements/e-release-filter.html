<div class="filterbar release-filterbar">
  <span class="filterbar__label">Filter</span>
  <label class="search" aria-label="Search releases">
    <svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="7" cy="7" r="4.2" stroke="currentColor" stroke-width="1.3"/><path d="M10.2 10.2L13 13" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
    <input type="search" class="release-search" placeholder="Search changelog — e.g. WebP, rename, PNG">
  </label>
  <button class="chip is-on" data-chip="all" type="button">All</button>
  <button class="chip" data-chip="added" type="button">Added</button>
  <button class="chip" data-chip="improved" type="button">Improved</button>
  <button class="chip" data-chip="fixed" type="button">Fixed</button>
</div>
