<div class="content content--docs">
  <div class="content-grid">
    {{#toc}}<nav class="toc" aria-label="Table of contents"><div class="toc__title">On this page</div>{{{toc}}}</nav>{{/toc}}
    <article class="prose">
      {{#eyebrow}}<div class="eyebrow"><i></i> {{eyebrow}}</div>{{/eyebrow}}
      {{#title}}<h2>{{{title}}}</h2>{{/title}}
      {{#lead}}<p class="lead">{{{lead}}}</p>{{/lead}}
      <div class="content__prose">{{{prose}}}</div>
    </article>
  </div>
</div>
